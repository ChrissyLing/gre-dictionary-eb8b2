[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/dictionary-20261030-v4.html"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/dictionary-20261030-v4.html"
  status = 302
  force = true

[[redirects]]
  from = "/gre-dictionary.html"
  to = "/dictionary-20261030-v4.html"
  status = 302
  force = true

[[redirects]]
  from = "/dictionary-20261030-v3.html"
  to = "/dictionary-20261030-v4.html"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[redirects]]
  from = "/api/translate/mymemory"
  to = "https://api.mymemory.translated.net/get"
  status = 200
  force = true

[[redirects]]
  from = "/api/translate/google"
  to = "https://translate.googleapis.com/translate_a/single"
  status = 200
  force = true
