<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>GRE 单词小词典</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f5fa;
    color: #1f2333;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 760px; margin: 0 auto; padding: 36px 20px 48px; }

  /* ---------- header ---------- */
  .site-header { text-align: center; margin: 6px 0 22px; }
  .site-header h1 { font-size: 30px; letter-spacing: .5px; }
  .subtitle { color: #7a7f9a; margin-top: 7px; font-size: 14.5px; }

  /* ---------- search ---------- */
  .search-bar {
    display: flex; background: #fff; border: 2px solid #e3e6f3; border-radius: 16px;
    padding: 6px; box-shadow: 0 2px 14px rgba(80, 90, 180, .08); transition: border-color .15s;
  }
  .search-bar:focus-within { border-color: #8a8ff0; }
  .search-bar input {
    flex: 1; border: none; outline: none; font-size: 17px; padding: 10px 14px;
    background: transparent; font-family: inherit; color: inherit; min-width: 0;
  }
  .search-bar button {
    border: none; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
    font-size: 15.5px; font-weight: 600; padding: 0 26px; border-radius: 12px;
    cursor: pointer; font-family: inherit; transition: filter .15s, transform .05s;
  }
  .search-bar button:hover { filter: brightness(1.07); }
  .search-bar button:active { transform: scale(.97); }

  /* ---------- chips ---------- */
  .chips-row { margin-top: 14px; display: flex; align-items: flex-start; gap: 10px; }
  .chips-label {
    flex-shrink: 0; color: #8b90aa; font-size: 13px; padding: 7px 0;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: #eef0f8; color: #3d4265; border: none; border-radius: 999px;
    padding: 6px 14px; font-size: 14px; cursor: pointer; transition: background .15s, color .15s;
    font-family: inherit;
  }
  .chip:hover { background: #e2e6ff; color: #4348b8; }

  /* ---------- status ---------- */
  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 30px 0; color: #6b7094; }
  .spinner {
    width: 17px; height: 17px; border: 2.5px solid #c7cbf0; border-top-color: #5b5bd6;
    border-radius: 50%; display: inline-block; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    background: #fff1f0; border: 1px solid #ffd6d3; color: #b3413a;
    padding: 13px 17px; border-radius: 12px; font-size: 14.5px; margin-top: 16px;
  }

  /* ---------- empty state ---------- */
  .empty-state { text-align: center; padding: 44px 0 10px; }
  .empty-icon { font-size: 44px; }
  .empty-state > p { color: #7a7f9a; margin: 12px 0 22px; font-size: 15px; }
  .empty-state .chips { justify-content: center; }

  /* ---------- result cards ---------- */
  #result { margin-top: 18px; }
  .card {
    background: #fff; border-radius: 16px; padding: 20px 22px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(30, 35, 80, .05), 0 8px 24px rgba(30, 35, 80, .04);
  }
  .card-title { font-size: 15px; color: #5b5bd6; margin-bottom: 14px; letter-spacing: .5px; }

  .word-card { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; }
  .word-title {
    font-family: Georgia, "Times New Roman", serif; font-size: 38px; font-weight: 700;
    line-height: 1.15; display: flex; align-items: center; gap: 10px;
  }
  .star-btn {
    border: none; background: none; font-size: 26px; cursor: pointer; color: #c3c7dd;
    transition: color .15s, transform .1s; padding: 2px; line-height: 1;
  }
  .star-btn:hover { color: #d4a72c; transform: scale(1.15); }
  .star-btn.starred { color: #e8a50f; }
  .word-meta { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .phonetic { color: #7a7f9a; font-size: 16px; font-family: Georgia, serif; }
  .audio-btn {
    border: none; background: #eef0ff; color: #5b5bd6; border-radius: 999px;
    padding: 5px 15px; font-size: 13.5px; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .audio-btn:hover { background: #e2e6ff; }
  .word-zh {
    flex: 1; min-width: 220px; text-align: right; font-size: 20px; font-weight: 600;
    color: #2a2f45; line-height: 1.5;
  }
  @media (max-width: 620px) { .word-zh { text-align: left; } }

  .pos-group { margin-bottom: 16px; }
  .pos-group:last-child { margin-bottom: 0; }
  .pos-tag {
    display: inline-block; background: linear-gradient(135deg, #eef0ff, #f3efff); color: #5b5bd6;
    font-size: 12.5px; font-weight: 600; padding: 3px 12px; border-radius: 999px;
    letter-spacing: .3px; font-style: italic; margin-bottom: 9px;
  }
  .definition { padding: 7px 0 9px; border-bottom: 1px dashed #eef0f6; }
  .definition:last-child { border-bottom: none; padding-bottom: 0; }
  .def-en { font-size: 15px; line-height: 1.55; }
  .def-zh { font-size: 13.5px; color: #8a8fa8; margin-top: 3px; line-height: 1.55; }
  .pending { color: #a9adc4; }
  mark { background: #fff3bf; border-radius: 3px; padding: 0 2px; }

  .example { padding: 10px 0; border-bottom: 1px dashed #eef0f6; }
  .example:last-child { border-bottom: none; padding-bottom: 0; }
  .example:first-child { padding-top: 2px; }
  .ex-en { font-size: 15px; line-height: 1.6; font-style: italic; color: #343958; }
  .ex-zh { font-size: 13.5px; color: #8a8fa8; margin-top: 4px; line-height: 1.55; }
  .empty-note { color: #9aa0b5; font-size: 14px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .two-col { grid-template-columns: 1fr; } }

  /* ---------- favorites ---------- */
  .fav-section { margin-top: 26px; }
  .fav-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .fav-head h2 { font-size: 16px; color: #3d4265; }
  .fav-actions { display: flex; gap: 8px; }
  .text-btn {
    border: none; background: #eef0f8; color: #5a5f7d; border-radius: 8px;
    padding: 5px 13px; font-size: 13px; cursor: pointer; font-family: inherit; transition: background .15s;
  }
  .text-btn:hover { background: #e2e5f2; }
  .text-btn.danger:hover { background: #ffe3e0; color: #b3413a; }
  .fav-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
  .fav-zh { color: #8a8fa8; font-size: 13.5px; flex: 1; min-width: 100px; }
  .fav-remove {
    border: none; background: none; color: #c3c7dd; cursor: pointer; font-size: 14px;
    padding: 2px 6px; border-radius: 6px; transition: color .15s, background .15s;
  }
  .fav-remove:hover { color: #b3413a; background: #fff1f0; }

  footer { text-align: center; color: #a0a4bd; font-size: 12.5px; margin-top: 44px; line-height: 1.8; }

  /* ---------- GRE 本地词库 ---------- */
  .badges { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    background: #fff4e6; color: #c2410c; border: 1px solid #ffe0c2; white-space: nowrap;
  }
  .badge.se { background: #eefaf0; color: #15803d; border-color: #cdeed5; }
  .kaofa { padding: 9px 0; border-bottom: 1px dashed #eef0f6; }
  .kaofa:last-of-type { border-bottom: none; }
  .kf-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .kf-no { flex-shrink: 0; font-size: 12px; color: #d97706; font-weight: 700; }
  .kf-pos { color: #8a8fa8; font-size: 13px; font-style: italic; }
  .kf-zh { font-size: 15px; font-weight: 600; }
  .kf-en { font-size: 13px; color: #8a8fa8; margin-top: 3px; line-height: 1.55; }
  .mnemonic {
    margin-top: 12px; background: #fffbf0; border: 1px dashed #f0e2b8; border-radius: 10px;
    padding: 9px 13px; font-size: 13px; color: #8a6d2f; line-height: 1.65;
  }
  .related { margin-top: 9px; font-size: 13px; color: #8a8fa8; line-height: 1.65; }
  .se-chip {
    background: #e8f8ec; color: #15803d; border: 1px solid #c6eccf; border-radius: 999px;
    padding: 6px 14px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600;
    transition: background .15s;
  }
  .se-chip:hover { background: #d6f0de; }
  .se-label {
    display: inline-block; font-size: 11.5px; font-weight: 700; color: #15803d;
    background: #e8f8ec; border-radius: 6px; padding: 1px 8px; margin-right: 8px; vertical-align: 2px;
    white-space: nowrap;
  }
  .se-pair-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 2px; }
</style>
</head>

<div class="page">

  <footer>

</div>

<script>
'use strict';

/* ================= 常量与元素 ================= */
const HOSTED = location.protocol === 'https:' && location.hostname.endsWith('.netlify.app');
const DICT_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
const GOOGLE_TR = (HOSTED ? '/api/translate/google' : 'https://translate.googleapis.com/translate_a/single') + '?client=gtx&sl=en&tl=zh-CN&dt=t&q=';
const MYMEMORY_TR = (HOSTED ? '/api/translate/mymemory' : 'https://api.mymemory.translated.net/get') + '?q=';
const SUGGESTIONS = ['subtle', 'pragmatic', 'ephemeral', 'appropriate', 'contentious',
  'ambiguous', 'obscure', 'equivocal', 'mitigate', 'essential'];
const HIST_KEY = 'greDictHistory';
const FAV_KEY = 'greDictFav';

const els = {
  input: document.getElementById('searchInput'),
  btn: document.getElementById('searchBtn'),
  historyRow: document.getElementById('historyRow'),
  historyChips: document.getElementById('historyChips'),
  status: document.getElementById('status'),
  result: document.getElementById('result'),
  empty: document.getElementById('emptyState'),
  suggestChips: document.getElementById('suggestChips'),
  favSection: document.getElementById('favSection'),
  favList: document.getElementById('favList'),
  favCount: document.getElementById('favCount'),
};

let reqSeq = 0;      // 防止快速连续查询时的竞态
let current = null;  // 当前展示的单词 { headword, phonetic, audioUrl }

/* ================= 工具函数 ================= */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function loadJSON(key) {
  try { const v = JSON.parse(localStorage.getItem(key)); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
}

/* ================= 翻译（MyMemory 优先，Google 兜底） ================= */
let backend = 'mymemory';

async function trGoogle(text) {
  const res = await fetchTimeout(GOOGLE_TR + encodeURIComponent(text), 5000);
  if (!res.ok) throw new Error('http ' + res.status);
  const d = await res.json();
  const out = (d && d[0] || []).map(seg => seg[0]).join('');
  if (!out) throw new Error('empty');
  return out;
}
async function trMyMemory(text) {
  const res = await fetchTimeout(MYMEMORY_TR + encodeURIComponent(text) + '&langpair=en|zh-CN', 8000);
  if (!res.ok) throw new Error('http ' + res.status);
  const d = await res.json();
  let out = d && d.responseData && d.responseData.translatedText;
  if (!out || /MYMEMORY WARNING|INVALID|QUOTA/i.test(out)) throw new Error('bad result');
  // MyMemory 偶尔在译文末尾附加 "[上下文…]" 之类的语料备注，去掉
  out = out.replace(/\s*[\[【][^\]】]*[\]】]\s*$/, '').trim() || out;
  return out;
}
async function zhTranslate(text) {
  const first = backend === 'google' ? trGoogle : trMyMemory;
  const second = backend === 'google' ? trMyMemory : trGoogle;
  try {
    return await first(text);
  } catch (e) {
    const out = await second(text);          // 主后端失败，切换到另一个
    backend = second === trGoogle ? 'google' : 'mymemory';
    return out;
  }
}

/* ================= 词典 API ================= */
async function fetchWord(word) {
  const res = await fetchTimeout(DICT_API + encodeURIComponent(word), 8000);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!Array.isArray(data) || !data.length || !data.every(e => e && typeof e === 'object')) {
    throw new Error('Invalid dictionary response');
  }
  return data;
}

function parseEntries(entries, query) {
  const headword = entries[0].word || query;
  let phonetic = entries[0].phonetic || '';
  let audioUrl = '';
  for (const e of entries) for (const p of (e.phonetics || [])) {
    if (!phonetic && p.text) phonetic = p.text;
    if (!audioUrl && p.audio) audioUrl = p.audio;
  }

  const defs = [];
  const syns = new Set();
  const ants = new Set();
  const exSet = new Set();
  const examples = [];

  const pushEx = t => {
    const k = t.toLowerCase();
    if (!exSet.has(k) && examples.length < 5) { exSet.add(k); examples.push(t); }
  };
  const pushSyn = (set, w) => {
    if (w && w.toLowerCase() !== headword.toLowerCase()) set.add(w.trim());
  };

  for (const e of entries) {
    for (const m of (e.meanings || [])) {
      const pos = m.partOfSpeech || '';
      (m.synonyms || []).forEach(s => pushSyn(syns, s));
      (m.antonyms || []).forEach(a => pushSyn(ants, a));
      for (const d of (m.definitions || [])) {
        if (d.definition && defs.length < 10) defs.push({ pos, definition: d.definition });
        if (d.example) pushEx(d.example);
        (d.synonyms || []).forEach(s => pushSyn(syns, s));
        (d.antonyms || []).forEach(a => pushSyn(ants, a));
      }
    }
  }
  return {
    headword, phonetic, audioUrl, defs, examples,
    syns: [...syns].slice(0, 16),
    ants: [...ants].slice(0, 12),
  };
}

/* ================= 渲染 ================= */
function highlight(text, words) {
  // 只转义一次，支持多个词同时高亮（用占位符避免嵌套包裹）
  let safe = esc(text);
  const list = Array.isArray(words) ? words : [words];
  for (const w of list) {
    if (!w) continue;
    const re = new RegExp('\\b(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)', 'gi');
    safe = safe.replace(re, m => '«' + m + '»');
  }
  return safe.replace(/«([^»]*)»/g, '<mark>$1</mark>');
}

/* ---------- 本地 GRE 词库查询（含简单变形还原） ---------- */
function stemVariants(word) {
  const v = [word];
  const add = x => { if (x && x.length >= 3 && !v.includes(x)) v.push(x); };
  add(word.replace(/ies$/, 'y'));
  add(word.replace(/ied$/, 'y'));
  add(word.replace(/es$/, ''));
  add(word.replace(/s$/, ''));
  add(word.replace(/ed$/, ''));
  add(word.replace(/d$/, ''));
  add(word.replace(/ing$/, ''));
  add(word.replace(/ing$/, 'e'));
  return v;
}
function localLookup(word) {
  if (!window.W1400) return null;
  for (const t of stemVariants(word)) if (W1400[t]) return { key: t, d: W1400[t] };
  return null;
}
function seLookup(word) {
  if (!window.SEQ) return null;
  for (const t of stemVariants(word)) if (SEQ[t]) return { key: t, list: SEQ[t] };
  return null;
}

function renderResult(p, local, se) {
  current = p;
  const groups = new Map();
  p.defs.forEach(d => {
    if (!groups.has(d.pos)) groups.set(d.pos, []);
    groups.get(d.pos).push(d);
  });

  const defsHtml = p.defs.length ? [...groups.entries()].map(([pos, list]) => `
    <div class="pos-group">
      <span class="pos-tag">${esc(pos)}</span>
      ${list.map(d => `
        <div class="definition">
          <p class="def-en">${esc(d.definition)}</p>
          <p class="def-zh"><span class="pending">翻译中…</span></p>
        </div>`).join('')}
    </div>`).join('') : '';

  const enCard = defsHtml ? `
    <section class="card">
      <h3 class="card-title">📖 英文词典释义</h3>
      ${defsHtml}
    </section>` : '';

  const badges = [];
  if (local) badges.push(`<span class="badge">GRE 急救1400词 · 考过${local.d.f}次</span>`);
  if (se) badges.push(`<span class="badge se">六选二等价词</span>`);

  const greCard = local ? `
    <section class="card">
      <h3 class="card-title">📕 考纲释义 · 急救1400词（一词多义）</h3>
      ${local.d.s.map((s, i) => `
        <div class="kaofa">
          <div class="kf-head">
            <span class="kf-no">考法${i + 1}</span>
            <span class="kf-pos">${esc(s.pos)}</span>
            <span class="kf-zh">${esc(s.zh)}</span>
          </div>
          ${s.en ? `<p class="kf-en">${esc(s.en)}</p>` : ''}
        </div>`).join('')}
      ${local.d.mn ? `<div class="mnemonic">💡 助记：${esc(local.d.mn)}</div>` : ''}
      ${local.d.rel ? `<div class="related">📎 相关词：${esc(local.d.rel)}</div>` : ''}
    </section>` : '';

  // 例句：六选二真题在前（等价词对高亮），词典例句在后
  const seExHtml = se ? se.list.map(e => `
      <div class="example">
        <p class="ex-en"><span class="se-label">六选二真题</span>${highlight(e.ex, [se.key, e.eq])}</p>
        <p class="ex-zh"><span class="pending">翻译中…</span></p>
      </div>`).join('') : '';
  const apiExHtml = p.examples.length
    ? p.examples.map(ex => `
        <div class="example">
          <p class="ex-en">${highlight(ex, p.headword)}</p>
          <p class="ex-zh"><span class="pending">翻译中…</span></p>
        </div>`).join('')
    : (se ? '' : '<p class="empty-note">这个词暂未收录例句，可以试试在近义词里找找看 🙈</p>');
  const exCard = (se || p.examples.length) ? `
    <section class="card">
      <h3 class="card-title">📝 例句</h3>
      ${seExHtml}${apiExHtml}
    </section>` : '';

  // 近义词：六选二等价词优先展示
  const seChips = se ? `
    <div class="se-pair-row">
      <span class="se-label">六选二等价</span>
      <div class="chips">${se.list.map(e => `<button class="se-chip" data-word="${esc(e.eq)}">${esc(e.eq)}</button>`).join('')}</div>
    </div>` : '';
  const synCard = (se || p.syns.length) ? `
    <section class="card">
      <h3 class="card-title">🔗 近义词（点击可直接查询）</h3>
      ${seChips}
      ${p.syns.length ? `<div class="chips">${p.syns.map(s => `<button class="chip" data-word="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
    </section>` : '';
  const antCard = p.ants.length ? `
    <section class="card">
      <h3 class="card-title">🚫 反义词</h3>
      <div class="chips">${p.ants.map(s => `<button class="chip" data-word="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    </section>` : '';

  const wordZhHtml = local
    ? esc(local.d.s.map(s => s.zh).join('；'))
    : '<span class="pending">翻译中…</span>';

  els.result.innerHTML = `
    <div class="card word-card">
      <div>
        <h2 class="word-title">${esc(p.headword)}
          <button class="star-btn" id="starBtn" type="button" title="加入 / 移出生词本">☆</button>
        </h2>
        <div class="word-meta">
          ${p.phonetic ? `<span class="phonetic">${esc(p.phonetic)}</span>` : ''}
          <button class="audio-btn" id="audioBtn" type="button">🔊 播放发音</button>
        </div>
        ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
      </div>
      <div class="word-zh" id="wordZh">${wordZhHtml}</div>
    </div>

    ${greCard}
    ${enCard}
    ${exCard}

    ${(synCard || antCard) ? `<div class="two-col">${synCard}${antCard}</div>` : ''}
  `;
  els.result.hidden = false;
  updateStarBtn();
  if (local) syncFavZh(p.headword, local.d.s.map(s => s.zh).join('；'));

  document.getElementById('audioBtn').addEventListener('click', playAudio);
  document.getElementById('starBtn').addEventListener('click', toggleStar);
}

/* 异步填充中文翻译 */
async function translateInto(el, text, seq, cb) {
  try {
    const zh = await zhTranslate(text);
    if (seq !== reqSeq || !el.isConnected) return;
    el.textContent = zh;
    if (cb) cb(zh);
  } catch (e) {
    if (seq === reqSeq && el.isConnected) el.textContent = '';
  }
}

function runTranslations(p, local, se, seq) {
  const wordZhEl = document.getElementById('wordZh');
  if (!local) {
    translateInto(wordZhEl, p.headword, seq, zh => syncFavZh(p.headword, zh));
  }
  els.result.querySelectorAll('.def-zh').forEach((el, i) => {
    if (p.defs[i]) translateInto(el, p.defs[i].definition, seq);
  });
  const allEx = (se ? se.list.map(e => e.ex) : []).concat(p.examples);
  els.result.querySelectorAll('.ex-zh').forEach((el, i) => {
    if (allEx[i]) translateInto(el, allEx[i], seq);
  });
}

/* ================= 发音 ================= */
function playAudio() {
  if (!current) return;
  const w = current.headword;
  if (current.audioUrl) {
    const audio = new Audio(current.audioUrl);
    audio.onerror = () => tts(w);
    audio.play().catch(() => tts(w));
  } else {
    tts(w);
  }
}
function tts(word) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ================= 查询主流程 ================= */
async function doSearch(raw) {
  const seq = ++reqSeq;
  const word = raw.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!word) return;
  if (!/^[a-z][a-z\s'-]*$/.test(word)) {
    els.empty.hidden = true;
    els.result.hidden = true;
    els.status.innerHTML = '<div class="error">请输入英文单词，例如 ephemeral 🙏</div>';
    return;
  }
  els.input.value = word;
  els.empty.hidden = true;
  els.result.hidden = true;
  els.status.innerHTML = '<div class="loading"><span class="spinner"></span>正在查询…</div>';
  const local = localLookup(word);
  const se = seLookup(word);
  const hasLocal = !!(local || se);
  if (hasLocal) {
    renderResult({
      headword: word, phonetic: '', audioUrl: '',
      defs: local ? local.d.s.filter(s => s.en).map(s => ({ pos: s.pos, definition: s.en })) : [],
      examples: [], syns: [], ants: [],
    }, local, se);
    addToHistory(word);
    els.status.innerHTML = '<p class="empty-note">已显示本地词库，正在补充在线释义…</p>';
    // 本地内容立即可用；发音、收藏和等价词不依赖在线词典。
    runTranslations(current, local, se, seq);
  }

  try {
    const entries = await fetchWord(word);
    if (seq !== reqSeq) return;
    if (!entries) {
      if (hasLocal) {
        els.status.innerHTML = '';
        return;
      }
      els.status.innerHTML =
        `<div class="error">没有找到「${esc(word)}」，请检查拼写后重试（目前仅支持英文单词）。</div>`;
      return;
    }
    const parsed = parseEntries(entries, word);
    if (!parsed.defs.length && !local && !se) {
      els.status.innerHTML = `<div class="error">「${esc(word)}」暂时没有收录释义。</div>`;
      return;
    }
    els.status.innerHTML = '';
    renderResult(parsed, local, se);
    if (!hasLocal) addToHistory(word);
    runTranslations(parsed, local, se, seq);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    if (seq !== reqSeq) return;
    els.status.innerHTML = hasLocal
      ? '<p class="empty-note">已显示本地词库；在线补充暂不可用，仍可查看释义、收藏和播放发音。</p>'
      : '<div class="error">本地词库未收录这个词，在线词典连接失败。请检查网络或稍后重试。</div>';
  }
}

/* ================= 历史 ================= */
function addToHistory(word) {
  let h = loadJSON(HIST_KEY).filter(w => w !== word);
  h.unshift(word);
  saveJSON(HIST_KEY, h.slice(0, 15));
  renderHistory();
}
function renderHistory() {
  const h = loadJSON(HIST_KEY);
  els.historyRow.hidden = h.length === 0;
  els.historyChips.innerHTML = h.map(w => `<button class="chip" data-word="${esc(w)}">${esc(w)}</button>`).join('');
}

/* ================= 生词本 ================= */
function getFavs() { return loadJSON(FAV_KEY); }

function updateStarBtn() {
  const btn = document.getElementById('starBtn');
  if (!btn || !current) return;
  const starred = getFavs().some(f => f.word.toLowerCase() === current.headword.toLowerCase());
  btn.classList.toggle('starred', starred);
  btn.textContent = starred ? '★' : '☆';
}

function toggleStar() {
  if (!current) return;
  const favs = getFavs();
  const i = favs.findIndex(f => f.word.toLowerCase() === current.headword.toLowerCase());
  if (i >= 0) {
    favs.splice(i, 1);
  } else {
    const zhEl = document.getElementById('wordZh');
    favs.unshift({
      word: current.headword,
      phonetic: current.phonetic || '',
      zh: zhEl && !zhEl.querySelector('.pending') ? zhEl.textContent : '',
    });
  }
  saveJSON(FAV_KEY, favs);
  updateStarBtn();
  renderFavs();
}

function syncFavZh(word, zh) {
  const favs = getFavs();
  const f = favs.find(x => x.word.toLowerCase() === word.toLowerCase());
  if (f && !f.zh) { f.zh = zh; saveJSON(FAV_KEY, favs); renderFavs(); }
}

function removeFav(i) {
  const favs = getFavs();
  if (i >= 0 && i < favs.length) {
    favs.splice(i, 1);
    saveJSON(FAV_KEY, favs);
    renderFavs();
    updateStarBtn();
  }
}

function renderFavs() {
  const favs = getFavs();
  els.favSection.hidden = favs.length === 0;
  els.favCount.textContent = favs.length ? `（${favs.length} 个词）` : '';
  els.favList.innerHTML = favs.map((f, i) => `
    <div class="fav-item">
      <button class="chip" data-word="${esc(f.word)}">${esc(f.word)}</button>
      ${f.phonetic ? `<span class="phonetic" style="font-size:13px;">${esc(f.phonetic)}</span>` : ''}
      <span class="fav-zh">${esc(f.zh || '')}</span>
      <button class="fav-remove" data-i="${i}" type="button" title="移除">✕</button>
    </div>`).join('');
}

function exportFavs() {
  const favs = getFavs();
  if (!favs.length) return;
  const lines = favs.map(f => [f.word, f.phonetic || '', f.zh || ''].join('\t'));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'GRE生词本.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= 事件绑定 ================= */
els.btn.addEventListener('click', () => doSearch(els.input.value));
els.input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(els.input.value); });

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== els.input) {
    e.preventDefault();
    els.input.focus();
    els.input.select();
  }
});

/* 所有词块（历史 / 推荐 / 生词本 / 近义词）统一代理点击查询 */
document.addEventListener('click', e => {
  const chip = e.target.closest('[data-word]');
  if (chip) { doSearch(chip.dataset.word); return; }
  const rm = e.target.closest('.fav-remove');
  if (rm) { removeFav(+rm.dataset.i); }
});

document.getElementById('exportFavBtn').addEventListener('click', exportFavs);
document.getElementById('clearFavBtn').addEventListener('click', () => {
  if (confirm('确定要清空生词本吗？此操作不可恢复。')) {
    saveJSON(FAV_KEY, []);
    renderFavs();
    updateStarBtn();
  }
});

/* ================= 初始化 ================= */
els.suggestChips.innerHTML = SUGGESTIONS.map(w =>
  `<button class="chip" data-word="${w}">${w}</button>`).join('');
renderHistory();
renderFavs();
els.input.focus();

// 支持 #单词 直接查询（可收藏或分享单词链接）
const initialWord = decodeURIComponent(location.hash.slice(1)).trim().toLowerCase();
if (initialWord) doSearch(initialWord);
</script>
