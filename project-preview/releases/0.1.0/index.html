<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRE 个人学习空间 · 测试版</title><link rel="stylesheet" href="./style.css"></head><body>
<header class="top"><a href="../../index.html" class="brand">GRE 个人学习空间 <span>测试版 0.1.0</span></a><button id="accountBtn" class="quiet">登录 / 账号</button></header>
<main><div id="notice" class="notice" role="status" hidden></div>
<section id="gate" class="gate panel"><p class="eyebrow">你的词库，你的学习进度</p><h1>收藏之后，真正记住它。</h1><p>登录后可在不同设备查看自己的收藏和复习进度。版本由你选择，新版发布不会自动切换。</p><button id="gateLogin" class="primary">邮箱登录</button><button id="localPreview" class="quiet" hidden>先体验本机模式</button><p id="gateHint" class="hint"></p><a href="../../../index.html" class="text">返回原查词网站</a></section>
<div id="workspace" hidden><div class="workspace-head"><div><p id="identity" class="eyebrow"></p><h1>个人学习空间</h1></div><div><span id="syncStatus" class="hint"></span> <button id="syncBtn" class="quiet">同步</button></div></div>
<nav class="tabs" aria-label="学习功能"><button data-tab="dictionary" aria-pressed="true">查词</button><button data-tab="favorites">我的收藏 <span id="count"></span></button><button data-tab="review">复习</button><button data-tab="versions">版本</button></nav>
<section id="dictionaryPane"><iframe id="dictionaryFrame" title="GRE 查词与等价词" hidden></iframe><p id="frameHint" class="hint">正在加载查词页面…</p></section>
<section id="favoritesPane" hidden><div class="section-head"><div><h2>我的收藏</h2><p class="hint">收藏和复习记录独立于应用版本保存。</p></div><div><button id="importBtn" class="quiet">导入旧网站本机收藏</button><button id="exportBtn" class="quiet">导出备份</button></div></div><form id="addForm" class="add-form"><input id="newWord" placeholder="英文单词，如 elusive" required maxlength="100" aria-label="添加英文单词"><input id="newMeaning" placeholder="中文释义（可选）" maxlength="1000" aria-label="中文释义"><button class="primary">加入收藏</button></form><input id="favoriteFilter" class="filter" placeholder="筛选我的收藏" aria-label="筛选收藏"><div id="favoritesList"></div></section>
<section id="reviewPane" hidden><div class="section-head"><div><h2>复习收藏</h2><p id="dueHint" class="hint"></p></div><button id="startReview" class="primary">开始一轮</button></div><div id="reviewArea" class="panel review"></div></section>
<section id="versionsPane" hidden><h2>版本选择</h2><p class="hint">当前版本 0.1.0。只有你点击切换后才会使用另一个版本；账号收藏和复习记录保持不变。</p><div id="preferredHint" class="notice" hidden></div><div id="versionList"></div></section>
</div></main>
<dialog id="accountDialog"><form method="dialog" class="dialog-head"><h2 id="accountTitle">邮箱登录</h2><button aria-label="关闭">×</button></form><div id="loginSection"><p class="hint">新邮箱验证成功后自动创建账号。验证码由腾讯云认证服务发送和验证。</p><label>邮箱<input id="email" type="email" autocomplete="email" placeholder="你的邮箱"></label><button id="sendCode" class="quiet">获取验证码</button><label>验证码<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码"></label><button id="verifyCode" class="primary">验证并登录</button><p id="authError" class="error" role="alert"></p></div><div id="loggedInSection" hidden><p id="accountEmail"></p><p class="hint">每个账号只同步自己的学习数据。本机已有收藏不会自动上传，需你主动选择导入。</p><button id="logout" class="quiet">退出登录</button></div></dialog>
<script type="module" src="./app.mjs"></script></body></html>
